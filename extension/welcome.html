<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>Welcome — AI Usage Monitor</title>
  <link rel="stylesheet" href="welcome.css">
</head>
<body>
  <header>
    <div class="brand"><img src="icons/icon128.png" alt=""><span>AI Usage Monitor</span></div>
    <select id="lang"><option value="en">English</option><option value="fa">فارسی</option></select>
  </header>

  <main>
    <section class="hero">
      <h1 data-i="title"></h1>
      <p class="lead" data-i="lead"></p>
      <ol class="first">
        <li data-i="first1"></li>
        <li data-i="first2"></li>
      </ol>
    </section>

    <section class="card">
      <h2 data-i="extTitle"></h2>
      <ul>
        <li data-i="ext1"></li><li data-i="ext2"></li><li data-i="ext3"></li><li data-i="ext4"></li>
      </ul>
    </section>

    <section class="card app">
      <h2 data-i="appTitle"></h2>
      <p data-i="appText"></p>
      <ul>
        <li data-i="app1"></li><li data-i="app2"></li><li data-i="app3"></li><li data-i="app4"></li><li data-i="app5"></li>
      </ul>
      <div class="cta">
        <a class="btn primary" id="dl" target="_blank" rel="noopener" href="https://github.com/Jolly-Panda-Works/ai-usage-monitor/releases/latest" data-i="download"></a>
        <a class="btn" target="_blank" rel="noopener" href="https://github.com/Jolly-Panda-Works/ai-usage-monitor" data-i="github"></a>
        <a class="btn" target="_blank" rel="noopener" href="https://useffarahmand.com" data-i="website"></a>
      </div>
    </section>

    <section class="card">
      <h2 data-i="linkTitle"></h2>
      <ol>
        <li data-i="link1"></li><li data-i="link2"></li><li data-i="link3"></li>
      </ol>
      <p class="muted" data-i="linkNote"></p>
    </section>
  </main>

  <footer>
    <span data-i="privacy"></span> ·
    <a target="_blank" rel="noopener" href="https://github.com/Jolly-Panda-Works/ai-usage-monitor/blob/main/PRIVACY.md" data-i="privacyLink"></a> ·
    <span data-i="disclaimer"></span>
  </footer>
  <script src="welcome.js"></script>
</body>
</html>
