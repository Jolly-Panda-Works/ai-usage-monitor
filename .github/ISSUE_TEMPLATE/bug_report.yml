name: Bug report
description: Something is not working
labels: [bug]
body:
  - type: dropdown
    id: service
    attributes:
      label: Service
      options: [Claude, ChatGPT, Gemini, Figma, Other / app itself]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "1.1.0 (see Settings → About)"
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect and what did you see? Screenshots help. Never include cookies, tokens or e-mails.
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
