name: Build and Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set version
        id: ver
        shell: bash
        run: node tools/set-version.js

      - name: Install
        run: npm install

      - name: Build
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Out-File -Encoding ascii dist/SHA256SUMS.txt

      # Main output: a GitHub Release (does not use the Actions artifact quota).
      - name: Publish release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: AI Usage Monitor v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt

      # Only for non-release builds (other branches / manual runs). Never fails the job:
      # GitHub's artifact storage quota can be full.
      - name: Upload artifacts (dev builds)
        if: steps.ver.outputs.release != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: AI-Usage-Monitor-${{ steps.ver.outputs.version }}
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          retention-days: 7
